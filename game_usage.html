<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أشير للصورة الصح!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Tajawal:wght@400;700;800&display=swap');
:root{--p:#3B9EE8;--a:#FFD166;--g:#06D6A0;--r:#EF476F;--t:#1A1A2E;--sh:0 6px 20px rgba(0,0,0,0.1);--rd:20px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:#F0F8FF;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 10px;background-image:radial-gradient(circle at 15% 15%,#FFD16628 0%,transparent 40%),radial-gradient(circle at 85% 85%,#3B9EE812 0%,transparent 40%);}
h1{font-family:'Fredoka One',cursive;font-size:1.8rem;color:var(--p);text-shadow:2px 2px 0 var(--a);margin-bottom:3px;text-align:center;}
.sub{font-size:.85rem;color:#888;margin-bottom:12px;text-align:center;}
.sb{display:flex;gap:16px;align-items:center;background:white;border-radius:50px;padding:8px 22px;box-shadow:var(--sh);margin-bottom:12px;font-weight:800;font-size:1rem;}
.pw{width:100%;max-width:460px;background:#D0E8FF;border-radius:20px;height:12px;margin-bottom:5px;overflow:hidden;}
.pf{height:100%;background:linear-gradient(90deg,var(--p),#6DC8F3);border-radius:20px;transition:width .4s;}
.pl{font-size:.8rem;color:#777;margin-bottom:18px;font-weight:700;text-align:center;}
.qt{background:var(--p);color:white;border-radius:var(--rd);padding:18px 28px;font-size:2rem;font-weight:800;text-align:center;box-shadow:0 6px 20px #3B9EE840;animation:pop .4s ease;width:100%;max-width:500px;margin-bottom:20px;}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.arr{font-size:1.8rem;animation:bounce 1s ease-in-out infinite;margin-bottom:10px;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.choices{display:flex;gap:18px;justify-content:center;margin-bottom:14px;}
.cb{width:155px;height:155px;background:white;border:3px solid #D0E8FF;border-radius:var(--rd);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:var(--sh);transition:all .2s;}
.cb:hover{transform:translateY(-4px) scale(1.04);border-color:var(--p);}
.cb img{width:80%;height:73%;object-fit:contain;}
.cb .cl{font-size:.88rem;font-weight:700;color:var(--t);text-align:center;padding:0 3px;}
.cb.correct{border-color:var(--g);background:#F0FFFB;animation:cpop .5s;}
.cb.wrong{border-color:var(--r);background:#FFF0F3;animation:shake .4s;}
@keyframes cpop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{font-size:1.8rem;text-align:center;min-height:46px;font-weight:700;margin-bottom:8px;}
.fb.ct{color:var(--g)} .fb.wt{color:var(--r)}
.nb{background:linear-gradient(135deg,var(--g),#04B589);color:white;border:none;border-radius:50px;padding:12px 34px;font-size:1rem;font-weight:800;font-family:'Tajawal',sans-serif;cursor:pointer;display:none;box-shadow:0 6px 16px #06D6A035;}
.nb.show{display:block;animation:fadeUp .3s;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ws{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center;}
.ws.show{display:flex;animation:pop .6s;}
.we{font-size:4.5rem;}
.wt2{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--p);text-shadow:2px 2px 0 var(--a);}
.wm{font-size:1rem;font-weight:700;color:var(--t);}
.rb{background:linear-gradient(135deg,var(--p),#2a7ec0);color:white;border:none;border-radius:50px;padding:12px 34px;font-size:1rem;font-weight:800;font-family:'Tajawal',sans-serif;cursor:pointer;}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;}
.sp{position:absolute;font-size:1.5rem;animation:fall 1.5s ease-in forwards;}
@keyframes fall{from{transform:translateY(-20px) rotate(0deg);opacity:1}to{transform:translateY(100vh) rotate(360deg);opacity:0}}
</style>
</head>

const T=15;let ord=[],cr=0,sc=0,cc=0,an=false;
function sh(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function init(){ord=sh([...Array(T).keys()]);}
function prog(){document.getElementById('pf').style.width=(cr/T*100)+'%';document.getElementById('pl').textContent='السؤال '+(cr+1)+' من '+T;}
function load(){
  an=false;document.getElementById('fb').textContent='';document.getElementById('fb').className='fb';document.getElementById('nb').classList.remove('show');prog();
  const p=Q[ord[cr]];
  document.getElementById('qt').textContent=p.q;
  const c=sh([{b:p.cb,l:p.cl,ok:true},{b:p.wb,l:p.wl,ok:false}]);
  const d=document.getElementById('ch');d.innerHTML='';
  c.forEach(x=>{const b=document.createElement('button');b.className='cb';b.innerHTML=`<img src="${x.b}"><div class="cl">${x.l}</div>`;b.onclick=()=>pick(b,x.ok,p.cl);d.appendChild(b);});
}
function pick(btn,ok,cl){
  if(an)return;an=true;
  if(ok){btn.classList.add('correct');document.getElementById('fb').textContent='🌟 صح! أحسنت!';document.getElementById('fb').className='fb ct';sc+=10;cc++;document.getElementById('sc').textContent=sc;document.getElementById('cc').textContent=cc;stars();}
  else{btn.classList.add('wrong');document.getElementById('fb').textContent='💪 الصح: '+cl;document.getElementById('fb').className='fb wt';document.querySelectorAll('.cb').forEach(b=>{if(b!==btn)b.classList.add('correct');});}
  document.getElementById('nb').classList.add('show');
}
function nxt(){cr++;if(cr>=T)win();else load();}
function win(){document.getElementById('pf').style.width='100%';document.getElementById('pl').textContent='انتهت! 🎉';document.getElementById('ga').style.display='none';document.getElementById('ws').classList.add('show');document.getElementById('wm').textContent=`أجبت صح ${cc} من ${T} 🎯`;stars(22);}
function rst(){sc=0;cc=0;cr=0;document.getElementById('sc').textContent='0';document.getElementById('cc').textContent='0';document.getElementById('ws').classList.remove('show');document.getElementById('ga').style.display='flex';init();load();}
function stars(n=7){const c=document.getElementById('st');const e=['⭐','🌟','✨','🎉','🏆','💫'];for(let i=0;i<n;i++){setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=e[Math.floor(Math.random()*e.length)];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1+Math.random())+'s';c.appendChild(s);setTimeout(()=>s.remove(),1800);},i*80);}}
init();load();
</script>
