<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسلسل الأحداث | Sequencing</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #4361ee;
    --blue-light: #7b9cff;
    --blue-soft: #e8eeff;
    --green: #52b788;
    --red: #ef476f;
    --text: #1a1a2e;
    --radius: 20px;
    --shadow: 0 8px 32px rgba(67,97,238,0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Tajawal", sans-serif;
    background: linear-gradient(135deg, #e8eeff 0%, #c8d8ff 50%, #f0e8ff 100%);
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
  }
  .container { max-width: 800px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 25px; }
  .header h1 {
    font-family: "Fredoka One", cursive;
    font-size: 2.2rem;
    color: var(--blue);
    text-shadow: 2px 2px 0 rgba(255,255,255,0.7);
    margin-bottom: 5px;
  }
  .header p { color: var(--blue); opacity: 0.7; font-size: 0.95rem; }
  .score-bar {
    background: white;
    border-radius: var(--radius);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .score-label { font-weight: 700; color: var(--blue); font-size: 0.9rem; }
  .score-value { font-family: "Fredoka One", cursive; font-size: 1.4rem; color: var(--blue); }
  .activity-selector {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 25px;
  }
  .activity-btn {
    background: white;
    border: 3px solid var(--blue-soft);
    border-radius: var(--radius);
    padding: 18px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: var(--shadow);
  }
  .activity-btn:hover { border-color: var(--blue-light); transform: translateY(-3px); background: var(--blue-soft); }
  .activity-btn.done { border-color: var(--green); background: #d8f3dc; }
  .activity-btn .emoji { font-size: 2.2rem; display: block; margin-bottom: 8px; }
  .activity-btn .title-ar { font-size: 0.95rem; font-weight: 700; color: var(--blue); }
  .activity-btn .title-en { font-size: 0.75rem; color: #888; margin-top: 3px; }
  .activity-btn .status { font-size: 0.8rem; margin-top: 5px; color: var(--green); font-weight: 700; }
  .game-area { display: none; }
  .game-area.active { display: block; }
  .back-btn {
    background: transparent;
    border: 2px solid var(--blue-light);
    border-radius: 12px;
    padding: 8px 18px;
    font-family: "Tajawal", sans-serif;
    font-size: 0.9rem;
    color: var(--blue);
    cursor: pointer;
    margin-bottom: 15px;
    transition: all 0.2s;
    font-weight: 700;
  }
  .back-btn:hover { background: var(--blue-soft); }
  .game-card {
    background: white;
    border-radius: 24px;
    padding: 25px;
    box-shadow: var(--shadow);
  }
  .game-title { font-size: 1.3rem; font-weight: 800; color: var(--blue); margin-bottom: 5px; }
  .game-title-en { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
  .instruction {
    background: var(--blue-soft);
    border-radius: 12px;
    padding: 12px 15px;
    margin-bottom: 20px;
    font-size: 0.95rem;
    color: var(--blue);
    font-weight: 600;
    border-right: 4px solid var(--blue-light);
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .seq-card {
    background: var(--blue-soft);
    border: 3px solid #c8d8ff;
    border-radius: 15px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    user-select: none;
  }
  .seq-card:hover { border-color: var(--blue-light); transform: scale(1.02); }
  .seq-card.selected { border-color: var(--blue); background: #d0dbff; transform: scale(1.03); }
  .seq-card.correct { border-color: var(--green); background: #d8f3dc; }
  .seq-card.wrong { border-color: var(--red); background: #ffe4e8; }
  .seq-card.placed { opacity: 0.35; pointer-events: none; }
  .seq-card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .card-text { font-size: 0.85rem; font-weight: 700; color: var(--text); }
  .card-text-en { font-size: 0.72rem; color: #666; margin-top: 2px; direction: ltr; }
  .card-number {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 28px;
    height: 28px;
    background: var(--green);
    color: white;
    border-radius: 50%;
    font-size: 0.85rem;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .seq-card.correct .card-number { display: flex; }
  .answer-section { margin-bottom: 20px; }
  .answer-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 12px; }
  .answer-slots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .answer-slot {
    background: #f0f0f0;
    border: 2px dashed #ccc;
    border-radius: 12px;
    padding: 8px 5px;
    text-align: center;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    cursor: pointer;
  }
  .answer-slot.filled { border-color: var(--green); background: #d8f3dc; border-style: solid; }
  .answer-slot.wrong-slot { border-color: var(--red); background: #ffe4e8; border-style: solid; }
  .answer-slot img { width: 100%; height: 70px; object-fit: cover; border-radius: 8px; margin-bottom: 4px; }
  .slot-number { font-size: 1.2rem; font-weight: 800; color: #bbb; margin-bottom: 4px; }
  .slot-label { font-size: 0.65rem; color: #555; margin-top: 2px; font-weight: 700; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .check-btn {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 25px;
    font-family: "Tajawal", sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .check-btn:hover { background: var(--blue-light); transform: scale(1.03); }
  .reset-btn {
    background: transparent;
    border: 2px solid var(--blue-light);
    border-radius: 12px;
    padding: 12px 20px;
    font-family: "Tajawal", sans-serif;
    font-size: 1rem;
    color: var(--blue);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
  }
  .reset-btn:hover { background: var(--blue-soft); }
  .game-feedback {
    margin-top: 15px;
    padding: 12px 15px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    display: none;
    text-align: center;
  }
  .game-feedback.show { display: block; }
  .game-feedback.correct { background: #d8f3dc; color: #2d6a4f; }
  .game-feedback.wrong { background: #ffe4e8; color: #c0392b; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔢 تسلسل الأحداث</h1>
    <p>Sequencing — رتّب الصور بالترتيب الصحيح!</p>
  </div>
  <div class="score-bar">
    <span class="score-label">⭐ نقاطك / Score</span>
    <span class="score-value" id="scoreDisplay">0</span>
    <span id="starsDisplay">🌑🌑🌑🌑</span>
  </div>
  <div class="activity-selector" id="activitySelector">
    <div class="activity-btn" id="btn0" onclick="showActivity(0)">
      <span class="emoji">🌅</span>
      <div class="title-ar">روتين الصباح</div>
      <div class="title-en">Morning Routine</div>
      <div class="status" id="status0"></div>
    </div>
    <div class="activity-btn" id="btn1" onclick="showActivity(1)">
      <span class="emoji">🥪</span>
      <div class="title-ar">صنع ساندويش</div>
      <div class="title-en">Making a Sandwich</div>
      <div class="status" id="status1"></div>
    </div>
    <div class="activity-btn" id="btn2" onclick="showActivity(2)">
      <span class="emoji">🏖️</span>
      <div class="title-ar">بناء قلعة رمل</div>
      <div class="title-en">Building a Sandcastle</div>
      <div class="status" id="status2"></div>
    </div>
    <div class="activity-btn" id="btn3" onclick="showActivity(3)">
      <span class="emoji">🍕</span>
      <div class="title-ar">صنع بيتزا</div>
      <div class="title-en">Making a Pizza</div>
      <div class="status" id="status3"></div>
    </div>
  </div>
  <div class="game-area" id="gameArea">
    <button class="back-btn" onclick="showSelector()">← العودة / Back</button>
    <div class="game-card" id="gameCard"></div>
  </div>
</div>

let score = 0, completed = {}, currentActivity = null, selectedCard = null, answers = [], shuffled = [];

function showSelector() {
  document.getElementById("activitySelector").style.display = "grid";
  document.getElementById("gameArea").classList.remove("active");
  currentActivity = null; selectedCard = null;
}

function showActivity(index) {
  currentActivity = index; selectedCard = null;
  answers = [null, null, null, null];
  shuffled = [...activities[index].cards].sort(() => Math.random() - 0.5);
  document.getElementById("activitySelector").style.display = "none";
  document.getElementById("gameArea").classList.add("active");
  renderGame();
}

function renderGame() {
  const act = activities[currentActivity];
  const cardsHTML = shuffled.map((card, i) => {
    const isPlaced = answers.includes(card);
    return `<div class="seq-card ${isPlaced ? "placed" : ""}" id="card_${i}" onclick="selectCard(${i})">
      <div class="card-number">${card.order}</div>
      <img src="${card.img}" alt="${card.ar}">
      <div class="card-text">${card.ar}</div>
      <div class="card-text-en">${card.en}</div>
    </div>`;
  }).join("");

  const slotsHTML = [1,2,3,4].map(num => {
    const filled = answers[num-1];
    return `<div class="answer-slot ${filled ? "filled" : ""}" id="slot_${num}" onclick="selectSlot(${num})">
      <div class="slot-number">${num}</div>
      ${filled ? `<img src="${filled.img}" alt="${filled.ar}"><div class="slot-label">${filled.ar}</div>` : ""}
    </div>`;
  }).join("");

  document.getElementById("gameCard").innerHTML = `
    <div class="game-title">${act.emoji} ${act.titleAr}</div>
    <div class="game-title-en">${act.titleEn}</div>
    <div class="instruction">📌 اضغط على صورة، ثم اضغط على المكان المناسب!<br>
    <span style="direction:ltr;display:block;text-align:left;font-size:0.85rem;margin-top:4px">Click a picture, then click the correct position!</span></div>
    <div class="cards-grid">${cardsHTML}</div>
    <div class="answer-section">
      <div class="answer-title">📋 الترتيب الصحيح / Correct Order:</div>
      <div class="answer-slots">${slotsHTML}</div>
    </div>
    <div class="btn-row">
      <button class="check-btn" onclick="checkAnswers()">✅ تحقق / Check</button>
      <button class="reset-btn" onclick="showActivity(${currentActivity})">🔄 إعادة / Reset</button>
    </div>
    <div class="game-feedback" id="gameFeedback"></div>`;
}

function selectCard(index) {
  const card = shuffled[index];
  if (answers.includes(card)) return;
  selectedCard = index;
  shuffled.forEach((_, i) => { const el = document.getElementById("card_"+i); if(el) el.classList.remove("selected"); });
  document.getElementById("card_"+index).classList.add("selected");
}

function selectSlot(slotNum) {
  if (selectedCard === null) return;
  const card = shuffled[selectedCard];
  if (answers.includes(card)) return;
  answers[slotNum-1] = card;
  selectedCard = null;
  renderGame();
}

function checkAnswers() {
  if (!answers.every(a => a !== null)) {
    const fb = document.getElementById("gameFeedback");
    fb.textContent = "⚠️ رتّب كل الصور أولاً! / Place all pictures first!";
    fb.className = "game-feedback show wrong"; return;
  }
  let correct = answers.every((card, i) => card.order === i+1);
  const fb = document.getElementById("gameFeedback");
  if (correct) {
    score += 25; updateScore();
    completed[currentActivity] = true;
    document.getElementById("btn"+currentActivity).classList.add("done");
    document.getElementById("status"+currentActivity).textContent = "✅ تم!";
    fb.textContent = "🎉 ممتاز! الترتيب صحيح! / Excellent! Correct order!";
    fb.className = "game-feedback show correct";
  } else {
    fb.textContent = "❌ حاول مرة ثانية! / Try again!";
    fb.className = "game-feedback show wrong";
    answers.forEach((card, i) => {
      if (card && card.order !== i+1) {
        const slot = document.getElementById("slot_"+(i+1));
        if (slot) { slot.style.animation="shake 0.3s ease"; setTimeout(()=>slot.style.animation="",400); }
      }
    });
  }
}

function updateScore() {
  document.getElementById("scoreDisplay").textContent = score;
  const s = score>=100?"⭐⭐⭐⭐":score>=75?"⭐⭐⭐🌑":score>=50?"⭐⭐🌑🌑":score>=25?"⭐🌑🌑🌑":"🌑🌑🌑🌑";
  document.getElementById("starsDisplay").textContent = s;
}
</script>
</body>
</html>
